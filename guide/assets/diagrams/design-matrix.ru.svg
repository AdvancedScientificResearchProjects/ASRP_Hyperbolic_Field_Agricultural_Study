<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" role="img" aria-labelledby="t d">
<title id="t">Запланированные 13 групп: все корзины пусты</title>
<desc id="d">Таблица 13 запланированных групп протокола v8.3: одна контрольная группа и каналы 17, 19 и 21 в четырёх режимах каждый: прямой, вода, кристалл, комбинированный. В каждой ячейке ноль фото, 13 из 13 корзин пустые плейсхолдеры. Справа факторы дизайна: 6 культур, 8 субстратов, 200 семян на группу и культуру, всего 15,600 семян, это число дизайна, а не выполненное испытание. Канал 14, мутагенез, это отдельная гипотеза без группы.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1100' height='500' rx='18' fill='url(#bg)'/>

