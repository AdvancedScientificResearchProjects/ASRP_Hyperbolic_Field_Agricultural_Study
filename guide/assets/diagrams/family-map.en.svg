<title id="t">Where the study sits in the hyperbolic-field family</title>
<desc id="d">A hub card for the emitter and channel technology behind patent application KZ 2025/1095.1, an application and not a granted patent, applicants being individuals. Four study cards below it: blood plasma, yeast, DAAT crystal, and this agricultural study, highlighted, which makes no separate IP claim. Sibling studies are listed in the previous README only; no repository link shows shared data or results.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='430' rx='18' fill='url(#bg)'/>

<text x='24' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='26' fill='#e6ecff' text-anchor='start' font-weight='700'>Where the study sits in the hyperbolic-field family</text>
<text x='24' y='72' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#8ea0d6' text-anchor='start' font-weight='400'>Siblings are named in the previous README; no shared data is shown</text>
