<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 346" width="1200" height="346" role="img" aria-labelledby="t d">
<title id="t">Лестница доказательств: какие ступени есть</title>
<desc id="d">Пять ступеней от плана к результату. Первая, протокол v8.3 с 13 группами: только план. Вторая, 23 фото и 17 файлов закладки: наблюдение. Третья, слепая панель моделей по одному кадру и микроскопический пилот на 8 кадрах: не подтверждено. Четвёртая, классификатор паттернов на 52 кадрах: на уровне кадров, завышен утечкой. Пятая, рандомизированный воспроизведённый результат: пока нет.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='346' rx='18' fill='url(#bg)'/>

<text x='24' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='26' fill='#e6ecff' text-anchor='start' font-weight='700'>Лестница доказательств: какие ступени есть</text>
<text x='24' y='72' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#8ea0d6' text-anchor='start' font-weight='400'>План не результат; пилот не испытание</text>
<text x='1176' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#4ecdc4' text-anchor='end' font-weight='700' letter-spacing='2'>ДОКАЗАТЕЛЬСТВА</text>
<rect x='24.0' y='120' width='220.8' height='156' rx='12' fill='#0b1430' stroke='#a78bfa' stroke-width='1.6'/>
<text x='36.0' y='149.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='start' font-weight='700'>1 · Протокол</text>
<text x='36.0' y='169.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>13 групп, 6 культур, 15,600</text>
<text x='36.0' y='189.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>семян на бумаге</text>
<text x='36.0' y='210.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#a78bfa' text-anchor='start' font-weight='800'>◇ ТОЛЬКО ПЛАН</text>
<defs><marker id='m8ea0d6' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10z' fill='#8ea0d6'/></marker></defs>
<path d='M245.8,185.0 L255.8,185.0' fill='none' stroke='#8ea0d6' stroke-width='2' marker-end='url(#m8ea0d6)'></path>
<rect x='256.8' y='120' width='220.8' height='156' rx='12' fill='#0b1430' stroke='#ffcf5c' stroke-width='1.6'/>
<text x='268.8' y='149.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='start' font-weight='700'>2 · Наблюдение</text>
<text x='268.8' y='169.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>23 фото лотков, 17 файлов</text>
<text x='268.8' y='189.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>закладки exp29, измерений</text>
<text x='268.8' y='209.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>нет</text>
<text x='268.8' y='230.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#ffcf5c' text-anchor='start' font-weight='800'>◧ НАБЛЮДЕНИЕ</text>
<path d='M478.6,185.0 L488.6,185.0' fill='none' stroke='#8ea0d6' stroke-width='2' marker-end='url(#m8ea0d6)'></path>
<rect x='489.6' y='120' width='220.8' height='156' rx='12' fill='#0b1430' stroke='#ffcf5c' stroke-width='1.6'/>
<text x='501.6' y='149.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='start' font-weight='700'>3 · Малые пилоты</text>
<text x='501.6' y='169.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>слепая панель по одному</text>
<text x='501.6' y='189.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>кадру; 8 кадров</text>
<text x='501.6' y='209.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>микроскопии; цвет не</text>
<text x='501.6' y='229.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>калиброван</text>
<text x='501.6' y='250.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#ffcf5c' text-anchor='start' font-weight='800'>◧ НЕ ПОДТВЕРЖДЕНО</text>
<path d='M711.4,185.0 L721.4,185.0' fill='none' stroke='#8ea0d6' stroke-width='2' marker-end='url(#m8ea0d6)'></path>
<rect x='722.4000000000001' y='120' width='220.8' height='156' rx='12' fill='#0b1430' stroke='#ffcf5c' stroke-width='1.6'/>
<text x='734.4000000000001' y='149.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='start' font-weight='700'>4 · Классификатор</text>
<text x='734.4000000000001' y='169.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>52 кадров, уровень кадров,</text>
<text x='734.4000000000001' y='189.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>псевдоповторы; не</text>
<text x='734.4000000000001' y='209.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>доказательство эффекта</text>
<text x='734.4000000000001' y='230.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#ffcf5c' text-anchor='start' font-weight='800'>◧ НЕ ПОДТВЕРЖДЕНО</text>
<path d='M944.2,185.0 L954.2,185.0' fill='none' stroke='#8ea0d6' stroke-width='2' marker-end='url(#m8ea0d6)'></path>
<rect x='955.2' y='120' width='220.8' height='156' rx='12' fill='#0b1430' stroke='#ffa657' stroke-width='1.6'/>
<text x='967.2' y='149.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='start' font-weight='700'>5 · Результат RCT</text>
<text x='967.2' y='169.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>рандомизированный,</text>
<text x='967.2' y='189.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>воспроизведённый,</text>
<text x='967.2' y='209.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>подсчёты по группам</text>
<text x='967.2' y='230.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#ffa657' text-anchor='start' font-weight='800'>✕ ПОКА НЕТ</text>
<text x='24' y='310' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>Ступени 3 и 4 это собственные отчёты репозитория, и они так и пишут</text>
<text x='24' y='330' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>в выводах.</text>
</svg>
