<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 836" width="1200" height="836" role="img" aria-labelledby="t d">
<title id="t">Заявлено и показано</title>
<desc id="d">Восемь строк: тема, что заявляют план или отчёт, что показывают файлы и слово-статус. RCT: 13 групп в плане, ни одна не содержит данных. Цели по всхожести и росту: диапазоны плана, подсчётов нет. Выживаемость в реголите выше 80 процентов: цель, данных нет. Exp29: заложен, результата роста нет. Панель по редису: 10 из 10 прогонов выбрали обработанную сторону на одном кадре одной моделью, пиксельные метрики не подтвердили. Цвет при микроскопии: не воспроизведён на 52 кадрах. Классификатор паттернов: на уровне кадров, завышен утечкой. Перципиентный слой: субъективный.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='836' rx='18' fill='url(#bg)'/>

