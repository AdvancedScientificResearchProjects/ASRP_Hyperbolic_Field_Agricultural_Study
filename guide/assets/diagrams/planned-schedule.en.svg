<title id="t">Planned schedule, five quarters</title>
<desc id="d">Redrawn schema, five quarters left to right: 2026 Q1: Mar: Protocol Finalization v8.3; 2026 Q2: Apr: Equipment Setup, May: Pilot Experiment, Jun: Main Experiment Start; 2026 Q3: Jul-Aug: Main Experiment, Sep: Growth Monitoring; 2026 Q4: Oct-Nov: Growth Monitoring, Dec: Data Analysis Start; 2027 Q1: Jan: Data Analysis, Feb-Mar: Publication. All of it is a plan.</desc>
