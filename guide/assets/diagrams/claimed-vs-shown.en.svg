<text x='594' y='256.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>No counts, heights or biomass anywhere</text>
<rect x='1000' y='210' width='176' height='78' rx='12' fill='#0b1430' stroke='#ffa657' stroke-width='1.6'/>
<text x='1088.0' y='256.5' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#ffa657' text-anchor='middle' font-weight='800'>✕ NONE YET</text>
<text x='24' y='340.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='start' font-weight='700'>Regolith</text>
<rect x='190' y='296' width='378' height='78' rx='12' fill='#0b1430' stroke='#6f9bff' stroke-width='1.6'/>
<text x='204' y='342.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>above 80 % survival in Mars / Moon simulants</text>
<rect x='580' y='296' width='418' height='78' rx='12' fill='#0b1430' stroke='#ffa657' stroke-width='1.6'/>
<text x='594' y='342.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>No regolith data</text>
<rect x='1000' y='296' width='176' height='78' rx='12' fill='#0b1430' stroke='#ffa657' stroke-width='1.6'/>
<text x='1088.0' y='342.5' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#ffa657' text-anchor='middle' font-weight='800'>✕ NONE YET</text>
<text x='24' y='426.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='start' font-weight='700'>Exp29 (2 x 2)</text>
