<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 836" width="1200" height="836" role="img" aria-labelledby="t d">
<title id="t">Claimed versus shown</title>
<desc id="d">Eight rows: topic, what the plan or a report claims, what the files show, and a status word. RCT: 13 groups planned, no group holds data. Germination and growth targets: planned ranges, no counts. Regolith survival above 80 percent: a target, no data. Exp29: laid down, no growth result. Radish panel: 10 of 10 runs picked the treated side on one frame by one model, pixel metrics did not confirm. Microscopy greenness: not reproduced on 52 frames. Pattern classifier: frame level, leakage inflated. Percipient layer: subjective.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='836' rx='18' fill='url(#bg)'/>

<text x='24' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='26' fill='#e6ecff' text-anchor='start' font-weight='700'>Claimed versus shown</text>
<text x='24' y='72' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#8ea0d6' text-anchor='start' font-weight='400'>Every row cites a file on the Evidence page</text>
<text x='1176' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#4ecdc4' text-anchor='end' font-weight='700' letter-spacing='2'>EVIDENCE</text>
<text x='24' y='108' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#4ecdc4' text-anchor='start' font-weight='700'>Topic</text>
<text x='190' y='108' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#4ecdc4' text-anchor='start' font-weight='700'>Claimed or planned</text>
<text x='580' y='108' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#4ecdc4' text-anchor='start' font-weight='700'>Shown by the files</text>
<text x='1000' y='108' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#4ecdc4' text-anchor='start' font-weight='700'>Status</text>
<text x='24' y='168.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='start' font-weight='700'>RCT</text>
<rect x='190' y='124' width='378' height='78' rx='12' fill='#0b1430' stroke='#6f9bff' stroke-width='1.6'/>
<text x='204' y='170.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>13 groups, 6 crops, 15,600 seeds (protocol v8.3)</text>
<rect x='580' y='124' width='418' height='78' rx='12' fill='#0b1430' stroke='#a78bfa' stroke-width='1.6'/>
<text x='594' y='170.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>No group holds data; 13 of 13 bins are empty</text>
<rect x='1000' y='124' width='176' height='78' rx='12' fill='#0b1430' stroke='#a78bfa' stroke-width='1.6'/>
<text x='1088.0' y='170.5' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#a78bfa' text-anchor='middle' font-weight='800'>◇ PLANNED ONLY</text>
<text x='24' y='245.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='start' font-weight='700'>Germination,</text>
<text x='24' y='263.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='start' font-weight='700'>growth</text>
<rect x='190' y='210' width='378' height='78' rx='12' fill='#0b1430' stroke='#6f9bff' stroke-width='1.6'/>
<text x='204' y='246.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>T50 -20-40 %, germination +10-20 %, growth</text>
<text x='204' y='266.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>+15-30 %</text>
