<rect x='580' y='382' width='418' height='78' rx='12' fill='#0b1430' stroke='#a78bfa' stroke-width='1.6'/>
<text x='594' y='428.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>Laid down 2026-06-29; no growth result</text>
<rect x='1000' y='382' width='176' height='78' rx='12' fill='#0b1430' stroke='#a78bfa' stroke-width='1.6'/>
<text x='1088.0' y='428.5' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#a78bfa' text-anchor='middle' font-weight='800'>◇ PLANNED ONLY</text>
<text x='24' y='512.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='start' font-weight='700'>Radish panel</text>
<rect x='190' y='468' width='378' height='78' rx='12' fill='#0b1430' stroke='#6f9bff' stroke-width='1.6'/>
<text x='204' y='514.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>treated side picked</text>
<rect x='580' y='468' width='418' height='78' rx='12' fill='#0b1430' stroke='#ffcf5c' stroke-width='1.6'/>
<text x='594' y='504.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>10 of 10 runs, one frame, one model family; pixel metrics</text>
<text x='594' y='524.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>disagree</text>
<rect x='1000' y='468' width='176' height='78' rx='12' fill='#0b1430' stroke='#ffcf5c' stroke-width='1.6'/>
<text x='1088.0' y='514.5' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#ffcf5c' text-anchor='middle' font-weight='800'>◧ NOT CONFIRMED</text>
