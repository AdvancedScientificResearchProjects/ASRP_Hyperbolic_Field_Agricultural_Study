<title id="t">Исследование, технология и патентная заявка</title>
<desc id="d">Перерисованная схема. Заявка KZ 2025/1095.1, Fractal Biomedical Hyperbolic Field System, экспертиза по существу: заявка, а не выданный патент, как её описывает прежний README. Она ведёт к технологии излучателей гиперболического поля, а та к трём исследованиям: это агрономическое, плазма крови, кристалл DAAT.</desc>
