<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="t d">
<title id="t">Место исследования в семействе гиперболических полей</title>
<desc id="d">Карточка-хаб технологии эмиттера и каналов, лежащей в основе патентной заявки KZ 2025/1095.1: это заявка, а не выданный патент, заявители физические лица. Под ней четыре карточки исследований: плазма крови, дрожжи, кристалл DAAT и это агрономическое исследование, выделенное, которое не заявляет отдельных прав на ИС. Соседние исследования названы только в прежнем README; ни одна ссылка на репозиторий не показывает общих данных или результатов.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='430' rx='18' fill='url(#bg)'/>

<text x='24' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='26' fill='#e6ecff' text-anchor='start' font-weight='700'>Место исследования в семействе гиперболических полей</text>
<text x='24' y='72' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#8ea0d6' text-anchor='start' font-weight='400'>Соседи названы в прежнем README; общих данных не показано</text>
<text x='1176' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#4ecdc4' text-anchor='end' font-weight='700' letter-spacing='2'>СЕМЕЙСТВО</text>
<rect x='250' y='98' width='700' height='130' rx='12' fill='#0b1430' stroke='#a78bfa' stroke-width='1.6'/>
<text x='600.0' y='132.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='18' fill='#e6ecff' text-anchor='middle' font-weight='700'>Технология эмиттера и каналов</text>
<text x='600.0' y='152.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='middle' font-weight='400'>основа ИС: заявка KZ 2025/1095.1 (FBHFS)</text>
<text x='600.0' y='172.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='middle' font-weight='400'>заявка, а не выданный патент; заявители физические лица</text>
<text x='600.0' y='193.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#a78bfa' text-anchor='middle' font-weight='800'>◇ ЗАЯВКА</text>
