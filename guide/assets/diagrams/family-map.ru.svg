<path d='M454.5,262.0 L454.5,270.0' fill='none' stroke='#8ea0d6' stroke-width='2' marker-end='url(#m8ea0d6)'></path>
<rect x='606.0' y='272' width='279.0' height='96' rx='12' fill='#0b1430' stroke='#4ecdc4' stroke-width='1.6'/>
<text x='745.5' y='301.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='middle' font-weight='700'>Исследование кристалла</text>
<text x='745.5' y='323.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='middle' font-weight='700'>DAAT</text>
<text x='745.5' y='343.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='middle' font-weight='400'>соседний репозиторий</text>
<path d='M745.5,262.0 L745.5,270.0' fill='none' stroke='#8ea0d6' stroke-width='2' marker-end='url(#m8ea0d6)'></path>
<rect x='897.0' y='272' width='279.0' height='96' rx='12' fill='#10223a' stroke='#34d399' stroke-width='1.6'/>
<text x='1036.5' y='301.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='middle' font-weight='700'>Это исследование: растения</text>
<text x='1036.5' y='321.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='middle' font-weight='400'>только пилотный слой</text>
<text x='1036.5' y='341.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='middle' font-weight='400'>не заявляет отдельных прав на ИС</text>
