<path d='M163.5,262.0 L163.5,270.0' fill='none' stroke='#8ea0d6' stroke-width='2' marker-end='url(#m8ea0d6)'></path>
<rect x='315.0' y='272' width='279.0' height='96' rx='12' fill='#0b1430' stroke='#4ecdc4' stroke-width='1.6'/>
