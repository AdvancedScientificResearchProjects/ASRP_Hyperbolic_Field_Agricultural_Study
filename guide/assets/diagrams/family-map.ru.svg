<line x1='163.5' y1='262' x2='1036.5' y2='262' stroke='#8ea0d6' stroke-width='2'/>
<line x1='600' y1='228' x2='600' y2='262' stroke='#8ea0d6' stroke-width='2'/>
<text x='24' y='394' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>Использует ли кристальная ветвь этого исследования кристалл DAAT, в</text>
<text x='24' y='414' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>репозитории не сказано.</text>
