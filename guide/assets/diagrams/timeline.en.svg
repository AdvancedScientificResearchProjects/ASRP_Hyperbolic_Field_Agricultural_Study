<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
<title id="t">Planned schedule and what happened</title>
<desc id="d">Two lanes, not to scale. Lane one, the plan: 2026 Q1 Mar: protocol v8.3 finalised; 2026 Q2 Apr equipment setup, May pilot, Jun main experiment starts; 2026 Q3 Jul-Aug main experiment, Sep growth monitoring; 2026 Q4 Oct-Nov growth monitoring, Dec data analysis starts; 2027 Q1 Jan data analysis, Feb-Mar publication. Lane two, the pilot layer: 2026-05-02 First photo of the 23-photo set; 2026-06-04 Labelled pea pair; mould confound in the control; 2026-06-16 Radish blind panel: one frame, one model; 2026-06-29 Exp29 laid down (2 x 2 seed x water); 2026-07-02 Microscopy pilot, 8 frames; 2026-07-03 Pattern analysis, 52 frames; 2026-07-07 Blind plant protocol with percipients designed; no result; 2026-07-08 Earlier-samples batch received; not analysed.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='520' rx='18' fill='url(#bg)'/>

