<desc id="d">Две дорожки, без масштаба. Первая, план: 2026 Q1 Март: протокол v8.3 финализирован; 2026 Q2 Апр: оборудование, май: пилот, июнь: старт основного; 2026 Q3 Июль-авг: основной эксперимент, сен: мониторинг роста; 2026 Q4 Окт-ноя: мониторинг роста, дек: старт анализа; 2027 Q1 Янв: анализ данных, фев-март: публикация. Вторая, пилотный слой: 2026-05-02 Первое фото набора из 23; 2026-06-04 Маркированная пара гороха; плесень в контроле; 2026-06-16 Слепая панель по редису: один кадр, одна модель; 2026-06-29 Заложен exp29 (2 x 2 семена x вода); 2026-07-02 Микроскопия, пилот, 8 кадров; 2026-07-03 Анализ паттернов, 52 кадра; 2026-07-07 Спроектирован слепой протокол с перципиентами; результата нет; 2026-07-08 Получена партия ранних образцов; анализа нет.</desc>
