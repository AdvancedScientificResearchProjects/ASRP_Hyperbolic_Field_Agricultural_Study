<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 346" width="1200" height="346" role="img" aria-labelledby="t d">
<title id="t">Evidence ladder: which rungs exist</title>
<desc id="d">Five rungs from plan to result. Rung one, protocol v8.3 with 13 groups: planned only. Rung two, 23 photos and 17 set-up files: observation. Rung three, one-frame blind-model panel and an 8-frame microscopy pilot: not confirmed. Rung four, a 52-frame pattern classifier: frame level and leakage inflated. Rung five, a randomised, replicated result: none yet.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='346' rx='18' fill='url(#bg)'/>

<text x='24' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='26' fill='#e6ecff' text-anchor='start' font-weight='700'>Evidence ladder: which rungs exist</text>
<text x='24' y='72' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#8ea0d6' text-anchor='start' font-weight='400'>A plan is not a result; a pilot is not a trial</text>
<text x='1176' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#4ecdc4' text-anchor='end' font-weight='700' letter-spacing='2'>EVIDENCE</text>
<rect x='24.0' y='120' width='220.8' height='156' rx='12' fill='#0b1430' stroke='#a78bfa' stroke-width='1.6'/>
<text x='36.0' y='149.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='start' font-weight='700'>1 · Protocol</text>
<text x='36.0' y='169.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>13 groups, 6 crops, 15,600</text>
<text x='36.0' y='189.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#8ea0d6' text-anchor='start' font-weight='400'>seeds on paper</text>
<text x='36.0' y='210.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='13' fill='#a78bfa' text-anchor='start' font-weight='800'>◇ PLANNED ONLY</text>
