<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" role="img" aria-labelledby="t d">
<title id="t">The planned 13 groups: all bins empty</title>
<desc id="d">A table of the 13 planned groups of protocol v8.3: one control group, and channels 17, 19 and 21 each in four modes, direct, water, crystal and combined. Every cell reads zero photos, 13 of 13 bins are empty placeholders. On the right the design factors: 6 crops, 8 substrates, 200 seeds per group and crop, 15,600 seeds in total, a design number and not an executed trial. Channel 14, mutagenesis, is a separate hypothesis without a group.</desc>
