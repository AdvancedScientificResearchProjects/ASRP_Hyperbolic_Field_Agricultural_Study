<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t d">
<title id="t">Гиперполе и растения</title>
<desc id="d">Сгенерированная иллюстрация, не скриншот. Сетка из 13 запланированных групп RCT (контроль и три канала на четыре режима), каждая ячейка нарисована пустой, потому что 13 из 13 корзин данных без фото; заголовок; три числа, посчитанные по репозиторию: 13 групп в плане, из них 13 пустых, 23 фото пилота, 10 прогонов слепой модели на одном кадре.</desc>
